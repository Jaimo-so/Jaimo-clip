<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipFlow — macOS 剪贴板历史</title>
<style>
:root{
  --fg: oklch(97% 0.004 260);
  --fg-2: oklch(84% 0.008 260);
  --muted: oklch(72% 0.012 260);
  --accent: oklch(74% 0.13 218);
  --danger: oklch(70% 0.17 25);
  --star: oklch(83% 0.15 85);
  --glass: oklch(24% 0.022 265 / 0.58);
  --glass-2: oklch(20% 0.02 265 / 0.42);
  --chip: oklch(100% 0 0 / 0.08);
  --chip-hi: oklch(100% 0 0 / 0.14);
  --hair: oklch(100% 0 0 / 0.08);
  --hair-2: oklch(100% 0 0 / 0.045);
  --sel: oklch(100% 0 0 / 0.13);
  --skel: oklch(100% 0 0 / 0.07);
  --skel-hi: oklch(100% 0 0 / 0.13);
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',system-ui,sans-serif;
  --font-mono:'SF Mono',ui-monospace,Menlo,monospace;
  --r:12px; --r-sm:7px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-body);
  color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(16px, 5vh, 56px) clamp(12px, 3vw, 24px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;overflow-y:auto;
}
.sr{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
/* macOS desktop wallpaper behind the glass — required backdrop for vibrancy */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(1100px 720px at 12% 8%, oklch(52% 0.16 268 / .85), transparent 58%),
    radial-gradient(880px 660px at 88% 16%, oklch(54% 0.12 205 / .7), transparent 60%),
    radial-gradient(760px 700px at 70% 96%, oklch(44% 0.15 330 / .6), transparent 58%),
    radial-gradient(600px 520px at 30% 88%, oklch(48% 0.13 175 / .45), transparent 62%),
    linear-gradient(165deg, oklch(19% 0.045 268), oklch(10% 0.02 255) 70%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(oklch(100% 0 0 / .035) 1px, transparent 1px);
  background-size:3px 3px;
}

/* ---------- Floating window (NSVisualEffectView / vibrancy) ---------- */
.window{
  width:100%;max-width:780px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(48px) saturate(190%);
  backdrop-filter:blur(48px) saturate(190%);
  border:0.5px solid oklch(100% 0 0 / 0.18);
  border-radius:var(--r);
  box-shadow:
    0 1px 0 oklch(100% 0 0 / 0.16) inset,
    0 0 0 0.5px oklch(0% 0 0 / 0.5),
    0 40px 90px -20px oklch(0% 0 0 / 0.62),
    0 12px 32px -12px oklch(0% 0 0 / 0.5);
  overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
}
.window::before{ /* top sheen */
  content:'';position:absolute;inset:0 0 auto;height:120px;pointer-events:none;
  background:linear-gradient(oklch(100% 0 0 / .07), transparent);
}

/* ---------- Search ---------- */
.search{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:0.5px solid var(--hair);position:relative}
.search svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.search input{
  flex:1;background:none;border:none;outline:none;
  font:400 15px/1.5 var(--font-body);color:var(--fg);
}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:none}
.search:focus-within{background:oklch(100% 0 0 / .04)}
.kbd{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.02em;
  padding:2px 5px;border-radius:4px;color:var(--fg-2);
  background:var(--chip);border:0.5px solid var(--hair);
  box-shadow:0 1px 0 oklch(0% 0 0 / .25);
}
.kbd.lite{color:var(--muted)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:3px;padding:8px 13px;border-bottom:0.5px solid var(--hair)}
.tabs{scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:5px 11px;min-height:26px;font-size:12.5px;letter-spacing:0.01em;color:var(--muted);
  border-radius:var(--r-sm);cursor:pointer;transition:background .14s,color .14s;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:none;border:none;font-family:inherit;
}
.tab:hover{color:var(--fg);background:var(--chip)}
.tab.on{color:var(--fg);background:var(--chip-hi);box-shadow:0 0.5px 0 oklch(100% 0 0 / .18) inset}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tab .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on .n{color:var(--fg-2)}

/* ---------- Two-pane body ---------- */
.panes{display:grid;grid-template-columns:1fr 296px;min-height:0}
.list{
  height:min(412px, 52vh);min-height:216px;
  overflow-y:auto;border-right:0.5px solid var(--hair);padding:6px 0;
}
.list:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.list::-webkit-scrollbar{width:7px}
.list::-webkit-scrollbar-track{background:transparent}
.list::-webkit-scrollbar-thumb{background:oklch(100% 0 0 / .16);border-radius:4px}
.row{
  display:flex;align-items:center;gap:11px;margin:1px 7px;padding:8px 9px;
  border-radius:var(--r-sm);cursor:pointer;position:relative;
  transition:background .12s ease;
}
.row:hover{background:oklch(100% 0 0 / .07)}
.row:active{background:oklch(100% 0 0 / .1)}
.row.on{background:var(--sel);box-shadow:0 0.5px 0 oklch(100% 0 0 / .16) inset}
.list:focus-visible .row.on{outline:1.5px solid oklch(74% 0.13 218 / .8);outline-offset:-1.5px}
.row.on::after{
  content:'';position:absolute;left:-3px;top:9px;bottom:9px;width:2.5px;
  border-radius:2px;background:var(--accent);
}
/* type glyph */
.glyph{
  width:48px;height:30px;border-radius:var(--r-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--chip);border:0.5px solid var(--hair);color:var(--fg-2);
}
.glyph.url{color:var(--fg)}
/* real image thumbnail — shows actual content, not a placeholder box */
.thumb{
  width:48px;height:30px;border-radius:5px;flex-shrink:0;overflow:hidden;
  border:0.5px solid oklch(100% 0 0 / .2);
  box-shadow:0 1px 3px oklch(0% 0 0 / .4);
  background:oklch(16% 0.02 265);
}
.thumb svg{display:block;width:100%;height:100%}

.body{flex:1;min-width:0}
.title{
  font-size:13.5px;line-height:1.45;color:var(--fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.title.code{font-family:var(--font-mono);font-size:12.5px}
.meta{display:flex;align-items:center;gap:7px;margin-top:2px;font-size:11px;color:var(--muted)}
.meta .dot{width:2.5px;height:2.5px;border-radius:50%;background:var(--muted);opacity:.7}
.meta .t{font-variant-numeric:tabular-nums}
.pin{color:var(--star);display:flex;align-items:center}
.pin svg{width:11px;height:11px}

/* ---------- Preview pane ---------- */
.preview{display:flex;flex-direction:column;min-width:0;background:var(--glass-2)}
.pv-stage{
  flex:1;min-height:0;padding:16px;display:flex;align-items:center;justify-content:center;
  border-bottom:0.5px solid var(--hair);overflow:hidden;
}
.pv-img{
  width:100%;border-radius:8px;overflow:hidden;
  border:0.5px solid oklch(100% 0 0 / .16);
  box-shadow:0 8px 24px -8px oklch(0% 0 0 / .6);
  background:oklch(14% 0.02 265);
}
.pv-img svg{display:block;width:100%;height:auto}
.pv-text{
  width:100%;align-self:stretch;font-family:var(--font-mono);font-size:11.5px;line-height:1.75;
  color:var(--fg-2);white-space:pre-wrap;word-break:break-word;
  max-height:232px;overflow:hidden;
}
.pv-info{padding:11px 14px 13px;display:flex;flex-direction:column;gap:7px}
.pv-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:11.5px}
.pv-k{color:var(--muted);letter-spacing:0.01em;flex-shrink:0}
.pv-v{color:var(--fg-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-acts{display:flex;gap:6px;padding:0 14px 13px}
.btn{
  flex:1;min-height:26px;padding:6px 0;border:0.5px solid var(--hair);border-radius:var(--r-sm);
  background:var(--chip);color:var(--fg);font:400 12px var(--font-body);
  cursor:pointer;transition:background .12s;display:flex;align-items:center;justify-content:center;gap:5px;
}
.btn:hover{background:var(--chip-hi)}
.btn:active{background:oklch(100% 0 0 / .2)}
.btn[disabled]{opacity:.42;cursor:not-allowed;pointer-events:none}
.btn.dn{color:var(--fg-2)}
.btn.dn:hover{color:oklch(84% 0.11 25);background:oklch(70% 0.17 25 / .16);border-color:oklch(70% 0.17 25 / .32)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.key{background:oklch(74% 0.13 218 / .22);border-color:oklch(74% 0.13 218 / .45)}
.btn.key:hover{background:oklch(74% 0.13 218 / .34)}
.btn svg{width:12px;height:12px}

/* ---------- Footer ---------- */
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 14px;border-top:0.5px solid var(--hair);
  background:oklch(100% 0 0 / .035);
}
.hints{display:flex;flex-wrap:wrap;gap:13px}
.hint{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap}
.count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Settings overlay (hidden behind ⌘, ) ---------- */
.scrim{
  position:fixed;inset:0;z-index:40;display:none;
  align-items:center;justify-content:center;padding:32px;
  background:oklch(8% 0.01 260 / .42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.scrim.open{display:flex}
.sheet{
  width:100%;max-width:472px;max-height:100%;overflow-y:auto;
  background:oklch(26% 0.022 265 / 0.72);
  -webkit-backdrop-filter:blur(52px) saturate(190%);
  backdrop-filter:blur(52px) saturate(190%);
  border:0.5px solid oklch(100% 0 0 / .2);border-radius:14px;
  box-shadow:0 1px 0 oklch(100% 0 0 / .18) inset, 0 44px 96px -22px oklch(0% 0 0 / .7);
  animation:pop .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{opacity:0;transform:scale(.965) translateY(6px)}to{opacity:1;transform:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid var(--hair)}
.sh-title{font-size:14px;font-weight:590;letter-spacing:-0.005em}
.sh-body{padding:14px 16px 16px}
.grp{margin-bottom:16px}
.grp:last-child{margin-bottom:0}
.grp-t{
  font-size:11px;font-weight:590;color:var(--fg-2);
  text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;
}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 0;font-size:13px}
.srow + .srow{border-top:0.5px solid var(--hair-2)}
.sval{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:4px}
.sw{
  width:38px;height:22px;border-radius:11px;flex-shrink:0;cursor:pointer;position:relative;
  background:oklch(100% 0 0 / .14);border:0.5px solid var(--hair);transition:background .18s;
}
.sw.on{background:var(--accent);border-color:transparent}
.sw::after{
  content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:oklch(99% 0 0);box-shadow:0 1px 2px oklch(0% 0 0 / .4);transition:transform .18s;
}
.sw.on::after{transform:translateX(16px)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;align-items:center;gap:9px;padding:6px 9px;margin-bottom:5px;font-size:12.5px;
  background:oklch(100% 0 0 / .055);border:0.5px solid var(--hair-2);border-radius:var(--r-sm)}
.app-n{flex:1}
.x{
  width:24px;height:24px;flex-shrink:0;margin:-3px -4px -3px 0;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;font-size:15px;line-height:1;border-radius:5px;
  background:none;border:none;font-family:inherit;transition:background .12s,color .12s;
}
.x:hover{color:oklch(84% 0.11 25);background:oklch(70% 0.17 25 / .16)}
.x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dgr{
  margin-top:12px;padding:7px 13px;font-size:12.5px;cursor:pointer;
  color:oklch(88% 0.09 25);background:oklch(70% 0.17 25 / .16);
  border:0.5px solid oklch(70% 0.17 25 / .34);border-radius:var(--r-sm);
  transition:background .12s;
}
.dgr:hover{background:oklch(70% 0.17 25 / .3)}
.dgr:focus-visible{outline:2px solid var(--danger);outline-offset:1px}
.dgr.armed{background:oklch(70% 0.17 25 / .34);border-color:oklch(70% 0.17 25 / .6);color:oklch(93% 0.06 25)}
.clr-hint{margin-top:7px;font-size:11.5px;line-height:1.65;color:var(--muted)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:60;
  padding:8px 15px;font-size:12.5px;border-radius:9px;pointer-events:none;
  background:oklch(24% 0.02 265 / .8);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);
  border:0.5px solid oklch(100% 0 0 / .18);box-shadow:0 14px 34px -12px oklch(0% 0 0 / .6);
  opacity:0;transition:opacity .18s,transform .18s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Empty / loading / error states ---------- */
.state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:52px 26px;text-align:center;height:100%;
}
.state-ico{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--chip);border:0.5px solid var(--hair);color:var(--muted);
}
.state-ico svg{width:20px;height:20px}
.state-ico.bad{background:oklch(70% 0.17 25 / .14);border-color:oklch(70% 0.17 25 / .3);color:oklch(84% 0.11 25)}
.state-t{font-size:13.5px;line-height:1.55;color:var(--fg-2)}
.state-d{font-size:12px;line-height:1.7;color:var(--muted);max-width:31ch}
.state-d .kbd{margin:0 1px}
.state .btn{flex:0 0 auto;margin-top:3px;padding:6px 14px}
.pv-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;font-size:12px;line-height:1.7;color:var(--muted);
}
/* skeleton rows while history loads */
.sk{display:flex;align-items:center;gap:11px;margin:1px 7px;padding:8px 9px}
.sk-m{width:48px;height:30px;border-radius:5px;flex-shrink:0}
.sk-b{flex:1;display:flex;flex-direction:column;gap:6px}
.sk-l{height:9px;border-radius:4px}
.sk-m,.sk-l{
  background:linear-gradient(90deg,var(--skel) 25%,var(--skel-hi) 37%,var(--skel) 63%);
  background-size:400% 100%;animation:shim 1.4s ease-in-out infinite;
}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .sheet{animation:fade .01ms}
  .sk-m,.sk-l{background:var(--skel-hi)}
}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:720px){
  .panes{grid-template-columns:1fr}
  .preview{
    grid-row:2;border-top:0.5px solid var(--hair);
    background:oklch(20% 0.02 265 / 0.5);
  }
  .pv-stage{display:none}
  .pv-info{display:none}
  .pv-acts{padding:11px 12px}
  .list{height:min(360px, 42vh)}
  .tabs{overflow-x:auto}
  .hints .hint:nth-child(n+4){display:none}
}
@media (max-width:520px){
  .hints .hint:nth-child(n+3){display:none}
  .search{padding:13px 13px}
  .pv-acts .btn.key{flex:2}
}
</style>
</head>

<!-- ============ reusable artwork: real, recognizable image content ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- A: mobile UI design file (3 screens) -->
    <symbol id="art-ui" viewBox="0 0 320 200">
      <rect width="320" height="200" fill="#191b22"/>
      <g fill="#22252e" stroke="#343946" stroke-width="1">

        <rect x="117" y="24" width="86" height="152" rx="10"/>

      <!-- screen 1: album art + waveform -->
      <rect x="27" y="36" width="68" height="52" rx="6" fill="#6d5bd6"/>
      <circle cx="61" cy="62" r="13" fill="#1a1b22"/><circle cx="61" cy="62" r="3.4" fill="#6d5bd6"/>

        <rect x="158" y="123" width="36" height="4.5" rx="2" fill="#c9cede"/><rect x="158" y="133" width="18" height="4" rx="2" fill="#5c6377"/>
        <rect x="126" y="152" width="26" height="19" rx="5" fill="#3fb6c4" opacity=".55"/>

      <rect x="225" y="36" width="68" height="68" rx="8" fill="#d67a9c"/>
      <path d="M245 60h10v22h-10z" fill="#1a1b22" opacity=".55"/><circle cx="268" cy="70" r="10" fill="#1a1b22" opacity=".55"/>
      <rect x="225" y="112" width="52" height="5" rx="2.5" fill="#c9cede"/>

      <rect x="225" y="136" width="68" height="3.5" rx="1.75" fill="#343946"/>
      <rect x="225" y="136" width="41" height="3.5" rx="1.75" fill="#3fb6c4"/>
      <g fill="#c9cede"><circle cx="243" cy="158" r="4"/><circle cx="259" cy="158" r="7.5"/><circle cx="275" cy="158" r="4"/></g>
    </symbol>

    <!-- B: analytics dashboard -->
    <symbol id="art-chart" viewBox="0 0 320 200">
      <rect width="320" height="200" fill="#15181e"/>
      <g stroke="#282d38" stroke-width="1">
        <path d="M28 44h266M28 74h266M28 104h266M28 134h266"/>
      </g>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3fb6c4" stop-opacity=".55"/><stop offset="1" stop-color="#3fb6c4" stop-opacity="0"/>

const listEl = document.getElementById('list');
const pvEl = document.getElementById('preview');
const tabsEl = document.getElementById('tabs');
const qEl = document.getElementById('q');
const countEl = document.getElementById('count');
const scrim = document.getElementById('scrim');
const toastEl = document.getElementById('toast');

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat = 'all', idx = 0, view = [], phase = 'loading';
const KEY = 'clipflow.state';
try{ const s = JSON.parse(localStorage.getItem(KEY)||'{}'); if(s.cat) cat = s.cat; if(typeof s.idx==='number') idx = s.idx; }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify({cat, idx})); }catch(e){} };

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1500);
}

function filtered(){
  const q = qEl.value.trim().toLowerCase();
  return DATA.filter(d => {
    const okCat = cat==='all' ? true : cat==='fav' ? d.fav : d.cat===cat;
    const okQ = !q || d.title.toLowerCase().includes(q) || d.app.toLowerCase().includes(q);
    return okCat && okQ;
  });
}

const CAT_LABEL = {all:'全部', text:'文字', image:'图片', link:'链接', fav:'收藏'};

function syncTabs(){
  tabsEl.querySelectorAll('.tab').forEach(t=>{
    const c = t.dataset.cat;
    const n = c==='all' ? DATA.length : c==='fav' ? DATA.filter(d=>d.fav).length : DATA.filter(d=>d.cat===c).length;
    t.querySelector('.n').textContent = n;
    const on = c===cat;
    t.classList.toggle('on', on);
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
  });
}

function paintState(){
  const q = qEl.value.trim();
  if (phase === 'loading'){
    listEl.innerHTML = Array.from({length:5}, ()=>
      `<div class="sk" aria-hidden="true"><div class="sk-m"></div><div class="sk-b">
        <div class="sk-l" style="width:72%"></div><div class="sk-l" style="width:38%;height:8px"></div>
      </div></div>`).join('');
    listEl.setAttribute('aria-busy','true');
    pvEl.innerHTML = '<div class="pv-empty">正在读取本地历史…</div>';
    countEl.textContent = '加载中…';
    return;
  }
  listEl.setAttribute('aria-busy','false');
  if (phase === 'error'){
    listEl.innerHTML = `<div class="state" role="alert">
      <div class="state-ico bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.9 2.5 18a1.8 1.8 0 0 0 1.6 2.7h15.8A1.8 1.8 0 0 0 21.5 18L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/></svg></div>
      <p class="state-t">无法读取剪贴板历史</p>
      <p class="state-d">本地数据库可能被占用或损坏。重试仍失败时，可在偏好设置中清空历史重建。</p>
      <button class="btn" type="button" id="doRetry">重试</button>
    </div>`;
    pvEl.innerHTML = '<div class="pv-empty">读取失败，暂无预览</div>';
    countEl.textContent = '读取失败';
    document.getElementById('doRetry').addEventListener('click', ()=>load());
    return;
  }
  const empty = q
    ? { t:`没有匹配「${esc(q)}」的记录`, d:'试试更短的关键词，或按 ESC 清空搜索后切换其他分类。' }
    : cat === 'fav'
      ? { t:'还没有收藏的记录', d:'选中一条记录后按 ⌘S 收藏，收藏项不会被数量上限淘汰。' }
      : { t:`${CAT_LABEL[cat]||''}分类下暂无记录`, d:'复制任意内容后会自动出现在这里。按 ⌥Space 可随时唤起窗口。' };
  listEl.innerHTML = `<div class="state">
    <div class="state-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="3" width="10" height="13" rx="2"/><path d="M6 7v12a2 2 0 0 0 2 2h8"/></svg></div>
    <p class="state-t">${empty.t}</p>
    <p class="state-d">${empty.d}</p>
  </div>`;
  pvEl.innerHTML = '<div class="pv-empty">选中一条记录后<br>这里显示完整内容</div>';
  countEl.textContent = '0 条 · 本地存储';
}

function render(){
  syncTabs();
  if (phase !== 'ready'){ view = []; paintState(); return; }

  view = filtered();
  if (idx > view.length - 1) idx = Math.max(0, view.length - 1);
  if (!view.length){ paintState(); return; }

  listEl.setAttribute('aria-busy','false');
  listEl.innerHTML = view.map((d,i)=>{
    const media = d.kind==='image'
      ? `<div class="thumb"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(d.alt||d.title)}"><use href="#${d.art}"/></svg></div>`
      : `<div class="glyph${d.kind==='link'?' url':''}" aria-hidden="true">${ICON[d.kind]||ICON.text}</div>`;
    return `<div class="row${i===idx?' on':''}" role="option" id="row-${d.id}" aria-selected="${i===idx}" data-i="${i}" data-od-id="clip-item-${d.id}">
      ${media}
      <div class="body">
        <div class="title${d.kind==='code'?' code':''}">${esc(d.title)}</div>
        <div class="meta"><span>${esc(d.app)}</span><span class="dot" aria-hidden="true"></span><span class="t">${d.time}</span>
        ${d.fav?`<span class="dot" aria-hidden="true"></span><span class="pin" title="已收藏">${ICON.star}<span class="sr">已收藏</span></span>`:''}</div>
      </div>
    </div>`;
  }).join('');
  listEl.setAttribute('aria-activedescendant', `row-${view[idx].id}`);

  const d = view[idx];
  const stage = d.kind==='image'
    ? `<div class="pv-img"><svg viewBox="0 0 320 200" role="img" aria-label="${esc(d.alt||d.title)}"><use href="#${d.art}"/></svg></div>`
    : `<div class="pv-text">${esc(d.full||d.title)}</div>`;

  pvEl.innerHTML = `${`<div class="pv-stage">${stage}</div>`}
    <div class="pv-info">
      ${d.info.map(([k,v])=>`<div class="pv-line"><span class="pv-k">${k}</span><span class="pv-v">${esc(v)}</span></div>`).join('')}
      <div class="pv-line"><span class="pv-k">来源</span><span class="pv-v">${esc(d.app)}</span></div>
      <div class="pv-line"><span class="pv-k">复制时间</span><span class="pv-v">${d.when}</span></div>
    </div>
    <div class="pv-acts">
      <button class="btn key" type="button" id="doCopy">复制到剪贴板 <span class="kbd" aria-hidden="true">↵</span></button>
      <button class="btn" type="button" id="doFav">${d.fav?'取消收藏':'收藏'}</button>
      <button class="btn dn" type="button" id="doDel" aria-label="删除这条记录" title="删除（⌘⌫）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M18 7v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2"/></svg>
      </button>
    </div>`;

  countEl.textContent = `${view.length} 条 · 本地存储`;
  listEl.querySelectorAll('.row').forEach(r=>r.addEventListener('click', ()=>{ idx = +r.dataset.i; save(); render(); listEl.focus(); }));
  document.getElementById('doCopy').addEventListener('click', copyToClipboard);
  document.getElementById('doFav').addEventListener('click', toggleFav);
  document.getElementById('doDel').addEventListener('click', removeItem);
}

function scrollIntoList(){
  const row = listEl.querySelector('.row.on');
  if (!row) return;
  const rt = row.offsetTop, rb = rt + row.offsetHeight;
  if (rt < listEl.scrollTop) listEl.scrollTop = rt - 6;
  else if (rb > listEl.scrollTop + listEl.clientHeight) listEl.scrollTop = rb - listEl.clientHeight + 6;
}

function move(step){
  if (!view.length) return;
  idx = Math.min(Math.max(idx + step, 0), view.length - 1);
  save(); render(); scrollIntoList();
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  return ok;
}

async function copyImage(d){
  const src = document.getElementById(d.art);
  if (!src || !window.ClipboardItem || !navigator.clipboard?.write) return false;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="960" height="600">${src.innerHTML}</svg>`;
  const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
  try {
    const img = new Image();
    await new Promise((res, rej)=>{ img.onload = res; img.onerror = rej; img.src = url; });
    const cv = document.createElement('canvas');
    cv.width = 960; cv.height = 600;
    cv.getContext('2d').drawImage(img, 0, 0, 960, 600);
    const blob = await new Promise(res=>cv.toBlob(res, 'image/png'));
    if (!blob) return false;
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    return true;
  } catch(e){
    return false;
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function copyToClipboard(){
  const d = view[idx];
  if (!d) return;

  if (d.kind === 'image'){
    const ok = await copyImage(d);
    toast(ok ? `已复制图片到剪贴板 · ${d.info[1][1]}` : '图片复制失败，当前环境不支持写入图片');
    return;
  }

  const text = d.full || d.title;
  let ok = false;
  try {
    if (navigator.clipboard?.writeText){ await navigator.clipboard.writeText(text); ok = true; }
    else ok = fallbackCopy(text);
  } catch(e){
    ok = fallbackCopy(text);
  }
  toast(ok ? `已复制到剪贴板 · ${text.length} 个字符` : '复制失败，请检查剪贴板权限');
}
function toggleFav(){
  const d = view[idx]; if(!d) return;
  d.fav = !d.fav; render();
  toast(d.fav ? '已加入收藏' : '已取消收藏');
}
function removeItem(){
  const d = view[idx]; if(!d) return;
  DATA.splice(DATA.indexOf(d), 1); render(); scrollIntoList();
  toast(`已删除「${d.title.slice(0,14)}${d.title.length>14?'…':''}」`);
}
function setCat(next){
  cat = next; idx = 0; save();
  render(); listEl.scrollTop = 0;
}
const settingsOpen = () => scrim.classList.contains('open');
const sheetEl = scrim.querySelector('.sheet');
let lastFocus = null;
function openSettings(){
  lastFocus = document.activeElement;
  scrim.classList.add('open');
  qEl.blur();
  sheetEl.focus();
}
function closeSettings(){
  scrim.classList.remove('open');
  disarmClear();
  (lastFocus && lastFocus.isConnected ? lastFocus : listEl).focus();
}

tabsEl.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>setCat(t.dataset.cat));
  t.addEventListener('keydown', e=>{
    const tabs = [...tabsEl.querySelectorAll('.tab')];
    const i = tabs.indexOf(t);
    let n = -1;
    if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = tabs.length - 1;
    if (n < 0) return;
    e.preventDefault(); e.stopPropagation();
    setCat(tabs[n].dataset.cat);
    tabsEl.querySelectorAll('.tab')[n].focus();
  });
});
qEl.addEventListener('input', ()=>{ idx = 0; save(); render(); });

const FOCUSABLE = 'button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';

document.addEventListener('keydown', e=>{
  const mod = e.metaKey || e.ctrlKey;

  if (mod && e.key === ',') { e.preventDefault(); settingsOpen() ? closeSettings() : openSettings(); return; }

  if (settingsOpen()){
    if (e.key === 'Escape') { e.preventDefault(); closeSettings(); return; }
    if (e.key === 'Tab'){
      const f = [...sheetEl.querySelectorAll(FOCUSABLE)].filter(el=>el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length-1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === sheetEl)){
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last){
        e.preventDefault(); first.focus();
      }
    }
    return;
  }

  if (phase !== 'ready' && !(mod && e.key.toLowerCase() === 'f')) {
    if (e.key !== 'Escape') return;
  }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.closest('button')) return;

  if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); qEl.focus(); qEl.select(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); toggleFav(); return; }
  if (mod && (e.key === 'Backspace' || e.key === 'Delete')) { e.preventDefault(); removeItem(); return; }

  if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); copyToClipboard(); }
  else if (e.key === 'Tab' && document.activeElement !== qEl && !document.activeElement.closest('.tabs')) {
    e.preventDefault();
    const list = [...tabsEl.querySelectorAll('.tab')].map(t=>t.dataset.cat);
    setCat(list[(list.indexOf(cat) + (e.shiftKey ? list.length-1 : 1)) % list.length]);
  }
  else if (e.key === 'Escape') { e.preventDefault(); if (qEl.value){ qEl.value=''; idx=0; save(); render(); } else toast('窗口已关闭（ESC）'); }
});

scrim.addEventListener('mousedown', e=>{ if (e.target === scrim) closeSettings(); });
document.querySelectorAll('.sw').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    sw.classList.toggle('on');
    sw.setAttribute('aria-checked', sw.classList.contains('on'));
  });
});
document.querySelectorAll('.app .x').forEach(x=>{
  x.addEventListener('click', ()=>{
    const name = x.closest('.app').querySelector('.app-n').textContent;
    x.closest('.app').remove();
    toast(`已将 ${name} 移出排除列表`);
  });
});

/* Destructive clear needs a deliberate second step */
const clearBtn = document.getElementById('clearAll');
const clearHint = document.getElementById('clrHint');
let armed = false, armTimer = 0;
function disarmClear(){
  armed = false; clearTimeout(armTimer);
  clearBtn.classList.remove('armed');
  clearBtn.textContent = '清空所有历史记录';
  clearHint.textContent = '此操作不可撤销，收藏的记录也会一并删除。点击后需再次确认。';
}
clearBtn.addEventListener('click', ()=>{
  if (!armed){
    armed = true;
    clearBtn.classList.add('armed');
    clearBtn.textContent = '确认清空？再次点击执行';
    clearHint.textContent = `将永久删除全部 ${DATA.length} 条记录（含收藏）。8 秒内未确认将自动取消。`;
    clearTimeout(armTimer); armTimer = setTimeout(disarmClear, 8000);
    return;
  }
  const n = DATA.length;
  DATA.length = 0;
  disarmClear();
  idx = 0; save(); render();
  closeSettings();
  toast(`已清空 ${n} 条历史记录`);
});

function load(){
  phase = 'loading'; render();
  setTimeout(()=>{ phase = 'ready'; render(); scrollIntoList(); }, 620);
}
load();
</script>
</body>
</html>
